<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#faf8ef;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
#game{background:#bbada0;padding:15px;border-radius:10px}
#grid{display:grid;grid-template-columns:repeat(4,90px);grid-gap:10px}
.cell{width:90px;height:90px;background:#cdc1b4;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;color:#776e65}
.v2{background:#eee4da}
.v4{background:#ede0c8}
.v8{background:#f2b179;color:#f9f6f2}
.v16{background:#f59563;color:#f9f6f2}
.v32{background:#f67c5f;color:#f9f6f2}
.v64{background:#f65e3b;color:#f9f6f2}
.v128{background:#edcf72;color:#f9f6f2;font-size:24px}
.v256{background:#edcc61;color:#f9f6f2;font-size:24px}
.v512{background:#edc850;color:#f9f6f2;font-size:24px}
.v1024{background:#edc53f;color:#f9f6f2;font-size:20px}
.v2048{background:#edc22e;color:#f9f6f2;font-size:20px}
#header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#score{background:#8f7a66;color:white;padding:10px;border-radius:6px;font-weight:bold}
button{background:#8f7a66;color:white;border:none;border-radius:6px;padding:10px;cursor:pointer}
</style>
</head>
<body>
<div id="game">
<div id="header">
<div id="score">Score: <span id="scoreVal">0</span></div>
<button onclick="resetGame()">New Game</button>
</div>
<div id="grid"></div>
</div>
<script>
let grid=[]
let score=0
const size=4
const gridEl=document.getElementById("grid")
const scoreEl=document.getElementById("scoreVal")

function init(){
 grid=Array(size).fill(0).map(()=>Array(size).fill(0))
 score=0
 addTile()
 addTile()
 draw()
}

function addTile(){
 let empty=[]
 for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(grid[r][c]===0)empty.push([r,c])
 if(empty.length===0)return
 let [r,c]=empty[Math.floor(Math.random()*empty.length)]
 grid[r][c]=Math.random()<0.9?2:4
}

function draw(){
 gridEl.innerHTML=""
 scoreEl.textContent=score
 for(let r=0;r<size;r++){
  for(let c=0;c<size;c++){
   let v=grid[r][c]
   let cell=document.createElement("div")
   cell.className="cell"+(v?" v"+v:"")
   cell.textContent=v?v:""
   gridEl.appendChild(cell)
  }
 }
}

function slide(row){
 let arr=row.filter(v=>v)
 for(let i=0;i<arr.length-1;i++){
  if(arr[i]===arr[i+1]){
   arr[i]*=2
   score+=arr[i]
   arr[i+1]=0
  }
 }
 arr=arr.filter(v=>v)
 while(arr.length<size)arr.push(0)
 return arr
}

function rotate(times){
 for(let t=0;t<times;t++){
  grid=grid[0].map((_,i)=>grid.map(r=>r[i]).reverse())
 }
}

function move(dir){
 let before=JSON.stringify(grid)
 if(dir==="left"){
  for(let r=0;r<size;r++)grid[r]=slide(grid[r])
 }
 if(dir==="right"){
  rotate(2)
  for(let r=0;r<size;r++)grid[r]=slide(grid[r])
  rotate(2)
 }
 if(dir==="up"){
  rotate(3)
  for(let r=0;r<size;r++)grid[r]=slide(grid[r])
  rotate(1)
 }
 if(dir==="down"){
  rotate(1)
  for(let r=0;r<size;r++)grid[r]=slide(grid[r])
  rotate(3)
 }
 if(JSON.stringify(grid)!==before){
  addTile()
  draw()
 }
}

function resetGame(){init()}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move("left")
 if(e.key==="ArrowRight")move("right")
 if(e.key==="ArrowUp")move("up")
 if(e.key==="ArrowDown")move("down")
})

init()
</script>
</body>
</html>
